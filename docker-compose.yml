services:
  shopify-mcp:
    build: .
    image: shopify-admin-mcp:latest
    container_name: shopify-mcp
    restart: unless-stopped
    env_file: .env
    # Ingress is the Tailscale Funnel on this host, which proxies
    # https://dvc-cloud.swordfish-walleye.ts.net/ -> http://127.0.0.1:3030.
    # Publish the container's 3000 on the host loopback at 3030 so the funnel
    # (and local curl tests) can reach it. Bound to 127.0.0.1 so it is NOT
    # exposed on the LAN — only the funnel fronts it publicly.
    ports:
      - "127.0.0.1:3030:3000"
    mem_limit: 512m
    # Persistent state for the automated auction engine (AUTO_AUCTION_STATE_DIR=/data).
    volumes:
      - mcp-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcp-data:
